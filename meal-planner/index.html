<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D6A3B">
</head>
<body>
<title>Vantillu Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F5EC; --surface:#FFFFFF; --surface-2:#EAEFE0; --ink:#1B261D; --muted:#5B6A5D; --line:#D6DDCB;
  --leaf:#2D6A3B; --leaf-hover:#245631; --leaf-ink:#FFFFFF; --leaf-soft:#DDEBD9;
  --turmeric:#C98A0E; --turmeric-soft:#F7E8C2; --chilli:#B8352A; --chilli-soft:#F7DDD8;
  --tile:#E8EEDD; --tile-warm:#F5EBD1; --tile-cool:#E3ECEA; --shadow:0 1px 2px rgba(27,38,29,.06),0 6px 18px rgba(27,38,29,.07);
  --display:"Baloo Tammudu 2","Nirmala UI","Gautami",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1511; --surface:#171F19; --surface-2:#1F2921; --ink:#E6ECE3; --muted:#9AA99C; --line:#2B372D;
    --leaf:#72C184; --leaf-hover:#8ED29E; --leaf-ink:#0F1511; --leaf-soft:#1F3525;
    --turmeric:#E7B447; --turmeric-soft:#3A2F14; --chilli:#E46E61; --chilli-soft:#3B1E1A;
    --tile:#223026; --tile-warm:#342D1D; --tile-cool:#1E2D2B; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1511; --surface:#171F19; --surface-2:#1F2921; --ink:#E6ECE3; --muted:#9AA99C; --line:#2B372D;
  --leaf:#72C184; --leaf-hover:#8ED29E; --leaf-ink:#0F1511; --leaf-soft:#1F3525;
  --turmeric:#E7B447; --turmeric-soft:#3A2F14; --chilli:#E46E61; --chilli-soft:#3B1E1A;
  --tile:#223026; --tile-warm:#342D1D; --tile-cool:#1E2D2B; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--turmeric);outline-offset:2px;border-radius:6px}
.te{font-family:var(--display);font-weight:600;color:var(--muted);letter-spacing:.01em}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand h1{font-size:28px;font-weight:800;color:var(--leaf);letter-spacing:-.01em}
.brand .te{font-size:17px}
.people{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--leaf)}
.tabs{display:flex;gap:4px}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:999px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.tab svg{width:18px;height:18px}
.tab[aria-current="page"]{background:var(--leaf);color:var(--leaf-ink)}
.tab:not([aria-current="page"]):hover{background:var(--surface-2);color:var(--ink)}
.tab .badge{background:var(--chilli);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}
main{max-width:1180px;margin:0 auto;padding:18px 16px 110px}
@media (max-width:760px){
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .top .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;border-radius:12px;position:relative}
  .tab .badge{position:absolute;top:0;right:4px}
  .brand h1{font-size:24px}
  .sync span{display:none}
}

/* shared bits */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.section-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.section-h h2{font-size:30px;font-weight:700}
.section-h p{margin:2px 0 0;color:var(--muted);max-width:60ch}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--leaf)}
.btn.primary{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.btn.primary:hover{background:var(--leaf-hover)}
.btn.warn{color:var(--chilli);border-color:color-mix(in srgb,var(--chilli) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.pill.ok{background:var(--leaf-soft);color:var(--leaf)}
.pill.soon{background:var(--turmeric-soft);color:var(--turmeric)}
.pill.bad{background:var(--chilli-soft);color:var(--chilli)}
.pill.plain{background:var(--surface-2);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.stepper button{border:0;background:transparent;width:32px;height:32px;font-size:18px;font-weight:600;color:var(--leaf)}
.stepper button:hover{background:var(--surface-2)}
.stepper span{min-width:62px;text-align:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.search{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:0;width:100%;max-width:280px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--turmeric-soft);border:1px solid color-mix(in srgb,var(--turmeric) 35%,transparent);padding:10px 14px;border-radius:12px;margin-bottom:16px;font-size:14px}

/* art */
.ic{display:inline-grid;place-items:center;border-radius:50%;background:var(--tile);flex:none}
.ic.warm{background:var(--tile-warm)} .ic.cool{background:var(--tile-cool)}
.ic svg{width:78%;height:78%;display:block}
.ic.s24{width:24px;height:24px}.ic.s32{width:32px;height:32px}.ic.s40{width:40px;height:40px}.ic.s56{width:56px;height:56px}.ic.s72{width:72px;height:72px}
.collage{display:flex;align-items:center}
.collage .ic{border:2.5px solid var(--surface)}
.collage .ic+.ic{margin-left:-14px}
.collage.big .ic+.ic{margin-left:-20px}
.collage.xs .ic+.ic{margin-left:-9px}
.collage.xs .ic{border-width:1.5px}

/* day strip */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:18px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;text-align:center;line-height:1.1}
.day b{display:block;font-family:var(--display);font-size:22px;font-weight:700}
.day small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day .dots{display:flex;gap:3px;justify-content:center;margin-top:5px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.day .dots i.p{background:var(--turmeric)} .day .dots i.c{background:var(--leaf)}
.day[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.day[aria-pressed="true"] small{color:inherit;opacity:.8}
.day[aria-pressed="true"] .dots i{background:color-mix(in srgb,var(--leaf-ink) 35%,transparent)}
.day[aria-pressed="true"] .dots i.p,.day[aria-pressed="true"] .dots i.c{background:var(--leaf-ink)}
.day.today:not([aria-pressed="true"]){border-color:var(--leaf);border-width:2px}

/* today */
.today-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:900px){.today-grid{grid-template-columns:1fr}}
.meal{padding:16px;display:grid;gap:12px}
.meal+.meal{margin-top:14px}
.meal-h{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.meal-h h3{font-size:22px;font-weight:700}
.meal.done{background:color-mix(in srgb,var(--leaf-soft) 55%,var(--surface))}
.dish-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--surface-2)}
.dish-row h4{margin:0;font-size:16px;font-weight:700}
.dish-row .te{font-size:14px}
.ing-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ing-tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:2px 8px 2px 2px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.ing-tag.short{border-color:color-mix(in srgb,var(--chilli) 50%,var(--line));color:var(--chilli)}
details.method{font-size:14px;color:var(--muted)}
details.method summary{cursor:pointer;font-weight:600;color:var(--leaf);font-size:13px}
details.method p{margin:6px 0 0;max-width:65ch}
.empty-slot{border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);flex-wrap:wrap}
.side h3{font-size:19px;margin-bottom:10px}
.side .card{padding:14px}
.side .card+.card{margin-top:14px}
.soon-item{display:flex;align-items:center;gap:10px;padding:6px 0}
.soon-item+.soon-item{border-top:1px solid var(--line)}
.soon-item .grow{flex:1;min-width:0}

/* week */
.week-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.week-bar .range{font-family:var(--display);font-size:20px;font-weight:700;min-width:170px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{padding:12px 14px}
.stat b{font-family:var(--display);font-size:26px;font-weight:700;display:block;line-height:1.1}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.week{display:grid;grid-template-columns:88px repeat(7,minmax(0,1fr));gap:6px}
.week .wh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:4px 6px}
.week .wh.today{color:var(--leaf)}
.week .wh b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);letter-spacing:0}
.week .wh.today b{color:var(--leaf)}
.week .sl{font-family:var(--display);font-weight:700;font-size:15px;padding:8px 4px;color:var(--muted)}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:5px;min-height:96px}
.cell.past{opacity:.6}
.cell.cooked{background:color-mix(in srgb,var(--leaf-soft) 60%,var(--surface))}
.dchip{display:flex;align-items:center;gap:6px;border-radius:9px;background:var(--surface-2);padding:3px 4px 3px 3px;font-size:12.5px;font-weight:600;line-height:1.15}
.dchip .n{flex:1;min-width:0;overflow-wrap:break-word;hyphens:auto;text-align:left;border:0;background:transparent;padding:0}
.dchip .x{border:0;background:transparent;color:var(--muted);width:20px;height:20px;border-radius:6px;font-size:14px;line-height:1;flex:none}
.dchip .x:hover{background:var(--chilli-soft);color:var(--chilli)}
.add{border:1.5px dashed var(--line);background:transparent;border-radius:9px;color:var(--muted);font-size:12.5px;font-weight:600;padding:4px;margin-top:auto}
.add:hover{border-color:var(--leaf);color:var(--leaf)}
@media (max-width:900px){
  .week{display:flex;flex-direction:column;gap:12px}
  .week .wh,.week .sl,.week .corner{display:none}
  .wday{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
  .wday-h{display:flex;align-items:baseline;gap:8px}
  .wday-h b{font-family:var(--display);font-size:20px}
  .wday .cell{border:0;background:var(--surface-2);min-height:0}
  .wday .cell .lbl{display:block}
}
@media (min-width:901px){.wday{display:contents}.wday-h{display:none}.cell .lbl{display:none}}
.cell .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* shop */
.shop-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:900px){.shop-grid{grid-template-columns:1fr}}
.store{padding:6px 14px 10px}
.store+.store{margin-top:14px}
.store-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.store-h h3{font-size:20px}
.item{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0}
.item+.item{border-top:1px solid var(--line)}
.item .nm{font-weight:700}
.item .why{font-size:12.5px;color:var(--muted)}
.item .amt{text-align:right;font-size:13px}
.item .amt b{display:block;font-size:15px}
.item.got .nm{text-decoration:line-through;color:var(--muted)}
.item .txt,.sug .txt{min-width:0;cursor:pointer}
.item .why,.sug .why{display:block;font-size:12.5px;color:var(--muted)}
.item .ctl,.sug .ctl{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.item .cost{font-size:13px;color:var(--muted);min-width:44px;text-align:right}
.rmx{border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:8px;font-size:18px;line-height:1}
.rmx:hover{background:var(--chilli-soft);color:var(--chilli)}
.sug{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0}
.sug+.sug{border-top:1px solid var(--line)}
.sugbox .store-h{align-items:start}
.btn:disabled{opacity:.5;cursor:default}
@media (max-width:620px){.item{grid-template-columns:auto auto minmax(0,1fr)}.item .ctl{grid-column:3/-1;justify-content:flex-start}.sug{grid-template-columns:auto minmax(0,1fr)}.sug .ctl{grid-column:2/-1;justify-content:flex-start}}
.tick{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--line);border-radius:7px;background:var(--surface);display:grid;place-items:center;margin:0;cursor:pointer}
.tick:checked{background:var(--leaf);border-color:var(--leaf)}
.tick:checked::after{content:"";width:6px;height:11px;border:solid var(--leaf-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.summary{padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px)}
.summary .total{font-family:var(--display);font-size:38px;font-weight:700;line-height:1}
.summary hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.copybox{width:100%;min-height:120px;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface-2);margin-top:8px}

/* pantry */
.grid-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
.tile{padding:12px;display:grid;gap:8px;align-content:start;position:relative}
.tile .top-row{display:flex;gap:10px;align-items:center}
.tile .nm{font-weight:700;font-size:14px;line-height:1.2}
.tile .te{font-size:13.5px;display:block}
.tile.out{background:color-mix(in srgb,var(--surface-2) 60%,var(--surface))}
.tile.out .ic{filter:grayscale(.8);opacity:.6}
.tile .meta{display:flex;gap:4px;flex-wrap:wrap;min-height:21px}
.tile .foot{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tile .note{font-size:12px;color:var(--muted)}
.cat-h{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
.cat-h h3{font-size:21px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 9px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].full{background:var(--leaf-soft);color:var(--leaf)}
.seg button[aria-pressed="true"].low{background:var(--turmeric-soft);color:var(--turmeric)}
.seg button[aria-pressed="true"].out{background:var(--chilli-soft);color:var(--chilli)}
.listbtn{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding:2px 4px;border-radius:6px}
.listbtn[aria-pressed="true"]{color:var(--leaf)}

/* dishes */
.pickers{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.pickv{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 6px 6px;display:grid;justify-items:center;gap:3px;min-width:78px;font-size:11.5px;font-weight:600;line-height:1.1;text-align:center}
.pickv[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.dish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dcard{padding:14px;display:grid;gap:10px;align-content:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);transition:border-color .15s,transform .15s}
.dcard:hover{border-color:var(--leaf);transform:translateY(-1px)}
.dcard h4{margin:0;font-size:17px;font-weight:700;line-height:1.2}
.dcard .te{font-size:15px}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.meter.mid i{background:var(--turmeric)} .meter.low i{background:var(--chilli)}
.dcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(10,16,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(760px,100%);max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media (min-width:761px){.sheet-wrap{align-items:center}.sheet{border-radius:20px;max-height:86%}}
.sheet-h{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:12px}
.sheet-h h2{font-size:26px}
.close{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;flex:none}
.pick-list{display:grid;gap:8px;margin-top:10px}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left}
.pick:hover{border-color:var(--leaf)}
.pick.in{border-color:var(--leaf);background:var(--leaf-soft)}
.pick h4{margin:0;font-size:15px}
.pick .miss{font-size:12px;color:var(--chilli)}
.pick .have{font-size:12px;color:var(--leaf)}
.detail-ings{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:12px 0}

 {id:'gummadikaya',en:'Gummadikaya Pulusu',te:'గుమ్మడికాయ పులుసు',cat:'pulusu',slots:'ld',mins:30,ing:[['pumpkin',400],['tamarind',25],['jaggery',20],['onion',100],['greenchilli',10]],steps:'Cook pumpkin cubes with onion and chillies. Add tamarind water, jaggery, chilli powder and salt; simmer until pumpkin is soft but holds shape.'},
 {id:'majjiga',en:'Majjiga Pulusu',te:'మజ్జిగ పులుసు',cat:'pulusu',slots:'ld',mins:25,ing:[['curd',400],['bottlegourd',200],['coconut',20],['ginger',10],['greenchilli',10]],steps:'Boil bottle gourd pieces. Grind coconut, ginger, chillies and a spoon of soaked chana dal; whisk into curd with water. Warm gently with the gourd without boiling, then temper.'},
 {id:'tomatocharu',en:'Tomato Charu',te:'టమాటా చారు',cat:'pulusu',slots:'ld',mins:20,ing:[['tomato',300],['tamarind',15],['garlic',0.25],['coriander',0.25],['curryleaves',0.25]],steps:'Boil mashed tomatoes in tamarind water with crushed garlic, pepper, cumin and turmeric. Temper with mustard, dry chilli and curry leaves; finish with coriander.'},
 {id:'pappucharu',en:'Pappu Charu',te:'పప్పు చారు',cat:'pulusu',slots:'ld',mins:30,ing:[['toordal',100],['tamarind',20],['onion',100],['tomato',100],['drumstick',1],['greenchilli',10]],steps:'Cook dal soft. Simmer onion, tomato and drumstick in tamarind water with chillies, add the mashed dal and water to a thin consistency, then temper.'},
 {id:'kodiguddu',en:'Kodiguddu Pulusu',te:'కోడిగుడ్డు పులుసు',cat:'pulusu',slots:'ld',mins:35,ing:[['eggs',4],['onion',200],['tomato',150],['tamarind',15],['ginger',10],['garlic',0.25]],steps:'Boil and peel eggs, slit lightly. Cook onion, ginger–garlic and tomato, add chilli powder, coriander powder and tamarind water. Simmer the eggs in the gravy 10 minutes.'},

 {id:'annam',en:'Annam (steamed rice)',te:'అన్నం',cat:'rice',slots:'ld',mins:20,ing:[['rice',200]],steps:'Rinse rice twice, cook with 2½ times water in a pressure cooker for 3 whistles or a pan until soft.'},
 {id:'chapati',en:'Chapati',te:'చపాతీ',cat:'rice',slots:'ld',mins:30,ing:[['atta',200],['ghee',10]],steps:'Knead atta with water and a pinch of salt, rest 20 minutes. Roll thin and cook on a hot tawa, brushing with ghee.'},
 {id:'nimmakaya',en:'Nimmakaya Pulihora',te:'నిమ్మకాయ పులిహోర',cat:'rice',slots:'ld',mins:25,ing:[['rice',200],['lemon',2],['peanuts',40],['chanadal',20],['greenchilli',15],['curryleaves',0.25]],steps:'Cook rice and spread to cool. Temper peanuts, chana dal, mustard, chillies, curry leaves and turmeric. Mix into rice with lemon juice and salt.'},
 {id:'chintapandu',en:'Chintapandu Pulihora',te:'చింతపండు పులిహోర',cat:'rice',slots:'ld',mins:35,ing:[['rice',200],['tamarind',40],['peanuts',40],['jaggery',10],['sesame',10],['curryleaves',0.25]],steps:'Cook tamarind pulp with salt, turmeric and a little jaggery to a thick paste. Temper peanuts and curry leaves, fold into cooled rice with the paste and sesame powder.'},
 {id:'daddojanam',en:'Daddojanam',te:'దద్దోజనం',cat:'rice',slots:'ld',mins:15,ing:[['rice',150],['curd',300],['ginger',10],['greenchilli',10],['curryleaves',0.25]],steps:'Mash soft cooked rice with curd and salt. Temper mustard, urad dal, ginger, chillies and curry leaves and stir in. Serve cool.'},

 {id:'tomatopachadi',en:'Tomato Pachadi',te:'టమాటా పచ్చడి',cat:'pachadi',slots:'bld',mins:20,ing:[['tomato',300],['tamarind',5],['garlic',0.25]],steps:'Fry tomatoes soft with dry chillies. Grind with tamarind, garlic and salt, then temper with mustard and hing.'},
 {id:'dosakayapachadi',en:'Dosakaya Pachadi',te:'దోసకాయ పచ్చడి',cat:'pachadi',slots:'ld',mins:15,ing:[['dosakaya',0.5],['greenchilli',15]],steps:'Chop yellow cucumber with skin. Grind roasted chillies, mustard and salt, then pulse in the cucumber coarsely. Temper and rest 30 minutes.'},
 {id:'allam',en:'Allam Pachadi',te:'అల్లం పచ్చడి',cat:'pachadi',slots:'b',mins:15,ing:[['ginger',60],['tamarind',20],['jaggery',30],['chanadal',10]],steps:'Fry ginger with chana dal and dry chillies. Grind with tamarind, jaggery and salt to a smooth sweet-sour chutney. The classic partner for pesarattu.'},
 {id:'pallichutney',en:'Palli Chutney',te:'పల్లీ చట్నీ',cat:'pachadi',slots:'b',mins:10,ing:[['peanuts',100],['greenchilli',15],['tamarind',5]],steps:'Roast peanuts and peel. Grind with chillies, tamarind, salt and water; temper with mustard and curry leaves.'},

/* ============ HELPERS ============ */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const dayNum=(d=new Date())=>Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const SLOTS=[['b','Breakfast','ఉదయం'],['l','Lunch','మధ్యాహ్నం'],['d','Dinner','రాత్రి']];
const todayKey=()=>keyOf(new Date());
function fracStr(q){const w=Math.floor(q+1e-9),r=Math.round((q-w)*100)/100;const f={0.25:'¼',0.5:'½',0.75:'¾'}[r];if(!r)return String(w);if(f)return (w?w:'')+f;return String(Math.round(q*10)/10)}
function fmtQty(q,unit){
  if(unit==='g'){if(q>=1000)return (Math.round(q/100)/10)+' kg';return Math.round(q)+' g'}
  if(unit==='jar')return '';
  const s=fracStr(q);
  if(unit==='pcs')return s+(q>1?' pcs':' pc');
  if(unit==='bunch')return s+(q>1?' bunches':' bunch');
  if(unit==='bulb')return s+(q>1?' bulbs':' bulb');
  return s+' '+unit;
}
const money=n=>'£'+n.toFixed(2);
const clone=o=>JSON.parse(JSON.stringify(o));

const LS='vantillu.state.v1', LS_UI='vantillu.ui.v1';
function sampleState(){
  const t=dayNum();
  const inv={};
  const put=(id,q,age=1)=>inv[id]={q,at:t-age};
  put('brinjal',500,2);put('okra',400,1);put('tomato',1000,2);put('onion',1500,6);put('potato',1500,8);put('greenchilli',100,3);
  put('curryleaves',1,4);put('coriander',0.5,3);put('ginger',150,6);put('garlic',2,8);put('lemon',3,5);put('bottlegourd',750,5);
  put('drumstick',3,5);put('spinach',250,3);put('carrot',500,4);put('cabbage',1,5);put('coconut',300,10);
  put('toordal',800,30);put('moongdal',500,30);put('chanadal',400,30);put('uraddal',600,30);put('wholemoong',300,30);put('rice',4000,20);
  put('upmarava',500,20);put('idlirava',800,20);put('tamarind',300,40);put('jaggery',400,40);put('peanuts',300,20);put('sesame',100,40);
  put('curd',800,2);put('ghee',300,30);put('eggs',6,5);put('atta',3000,20);
  const staples={};Object.values(ING).filter(i=>i.staple).forEach(i=>staples[i.id]='full');staples.cumin='low';
  return {v:2,people:2,inv,staples,plan:{},cooked:{},bought:{},list:{},skip:{},custom:[],sample:true,updatedAt:0};
}
function migrate(s){
  const b=sampleState();
  s=Object.assign({},b,s||{});
  for(const k of ['inv','staples','plan','cooked','bought','list','skip']) if(typeof s[k]!=='object'||!s[k]||Array.isArray(s[k])) s[k]={};
  if(Array.isArray(s.extras)){s.extras.forEach(id=>{if(ING[id]&&!s.list[id])s.list[id]=1});delete s.extras}
  if(!Array.isArray(s.custom))s.custom=[];
  return s;
}
function loadLocal(){try{const r=localStorage.getItem(LS);if(r)return migrate(JSON.parse(r))}catch(e){}return null}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}

let firstRun=false;
if(!state){state=sampleState();firstRun=true}
let ui={tab:'today',week:0,day:todayKey(),shop:'week',pantryCat:'all',pantryQ:'',dishCat:'all',dishQ:'',pickIngs:[]};
if([0,6].includes(new Date().getDay()))ui.shop='both';
try{const u=JSON.parse(localStorage.getItem(LS_UI)||'{}');if(u.tab)ui.tab=u.tab;if(u.shop)ui.shop=u.shop}catch(e){}
const saveUi=()=>{try{localStorage.setItem(LS_UI,JSON.stringify({tab:ui.tab,shop:ui.shop}))}catch(e){}};

const allDishes=()=>DISHES.concat(state.custom||[]);
const dishById=id=>allDishes().find(d=>d.id===id);
const scale=()=>state.people/2;
const invQ=id=>state.inv[id]?.q||0;
function setQ(id,q){q=Math.max(0,Math.round(q*100)/100);const cur=state.inv[id];if(q<=0){delete state.inv[id];return}if(!cur||cur.q<=0)state.inv[id]={q,at:dayNum()};else cur.q=q}
function addStock(id,q){const cur=invQ(id);if(cur<=0)state.inv[id]={q,at:dayNum()};else state.inv[id].q=Math.round((cur+q)*100)/100}
function freshness(id){
  const it=state.inv[id],g=ING[id];if(!it||it.q<=0||!g||g.shelf>60)return null;
  const age=dayNum()-(it.at??dayNum()),left=g.shelf-age;
  if(left<=0)return {cls:'bad',txt:'Past best',left};
  if(age/g.shelf>=0.6)return {cls:'soon',txt:left===1?'Use today':'Use in '+left+'d',left};
  return {cls:'ok',txt:'Fresh',left};
}
const planDay=k=>state.plan[k]||(state.plan[k]={b:[],l:[],d:[]});
const peekDay=k=>state.plan[k]||{b:[],l:[],d:[]};
const needFor=(d)=>{const out={};const s=scale();for(const [id,q] of d.ing){let v=q*s;if(ING[id]?.unit==='g')v=Math.ceil(v/5)*5;out[id]=(out[id]||0)+v}return out};
function slotNeeds(k,slot){const out={};for(const did of peekDay(k)[slot]){const d=dishById(did);if(!d)continue;for(const [id,q] of Object.entries(needFor(d)))out[id]=(out[id]||0)+q}return out}
function matchInfo(d,inv){inv=inv||Object.fromEntries(Object.entries(state.inv).map(([k,v])=>[k,v.q]));const need=needFor(d);let sum=0,n=0;const missing=[],have=[];for(const [id,q] of Object.entries(need)){const h=Math.min(1,(inv[id]||0)/q);sum+=h;n++;if(h<1)missing.push(id);else have.push(id)}return {pct:n?sum/n:0,missing,have}}

let dirty=false,saveTimer=null;
function commit(opts={}){state.updatedAt=Date.now();if(!opts.keepSample&&state.sample===true)state.sample='edited';prune();saveLocal();scheduleRemote();render()}
function prune(){const cutoff=keyOf(addDays(new Date(),-42));for(const k of Object.keys(state.plan))if(k<cutoff)delete state.plan[k];for(const k of Object.keys(state.cooked))if(k.split('|')[0]<cutoff)delete state.cooked[k]}

/* ============ SYNC (Claude artifact db when available) ============ */
let db=null,docRef=null,remoteReady=false,writing=false,writeAgain=false,firstSnap=true;
function setSync(on,txt){const el=document.getElementById('sync');el.classList.toggle('on',on);el.querySelector('span').textContent=txt;el.title=on?'Your plan syncs across your devices':'Your plan is saved in this browser'}
function scheduleRemote(){if(!docRef)return;clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,900)}
async function pushRemote(){
  if(!docRef)return;if(writing){writeAgain=true;return}
  writing=true;
  try{await docRef.set({json:JSON.stringify(state),updatedAt:state.updatedAt});setSync(true,'Synced')}
  catch(e){setSync(false,'Saved on this device');if(e&&e.code==='invalid_argument')docRef=null}
  writing=false;if(writeAgain){writeAgain=false;pushRemote()}
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    db=await window.claude.use('db');if(!db)return;
    docRef=db.doc('planner/state');
    docRef.onSnapshot(snap=>{
      remoteReady=true;
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      const d=snap.exists?snap.data():null;
      if(d&&d.json&&(d.updatedAt||0)>(state.updatedAt||0)){
        try{state=migrate(JSON.parse(d.json));saveLocal();render()}catch(e){}
        setSync(true,'Synced');
      }else if(firstSnap&&(!d||(d.updatedAt||0)<(state.updatedAt||0))&&state.updatedAt>0){
        setTimeout(pushRemote,50);
      }else setSync(true,'Synced');
      firstSnap=false;
    },()=>{setSync(false,'Saved on this device')});
  }catch(e){}
})();

/* ============ AUTO-PLAN ============ */
function mainIng(did){const d=dishById(did);return d?heroIngs(d)[0]:null}
function autoPlan(weekStart,{onlyEmpty=true}={}){
  const vinv=Object.fromEntries(Object.entries(state.inv).map(([k,v])=>[k,v.q]));
  const today=todayKey();
  // reserve stock for meals already planned and not cooked
  for(let i=0;i<7;i++){const k=keyOf(addDays(weekStart,i));if(k<today)continue;for(const [s] of SLOTS){if(state.cooked[k+'|'+s])continue;for(const [id,q] of Object.entries(slotNeeds(k,s)))vinv[id]=(vinv[id]||0)-q}}
  const used=new Set();for(let i=0;i<7;i++){const p=peekDay(keyOf(addDays(weekStart,i)));SLOTS.forEach(([s])=>p[s].forEach(x=>used.add(x)))}
  const soon=new Set(Object.keys(state.inv).filter(id=>{const f=freshness(id);return f&&f.cls!=='ok'}));
  let filled=0;
  for(let i=0;i<7;i++){
    const k=keyOf(addDays(weekStart,i));if(k<today)continue;
    const p=planDay(k);
    const dayMains=new Set([...p.b,...p.l,...p.d].map(mainIng));
    for(const [slot] of SLOTS){
      if(onlyEmpty&&p[slot].length)continue;
      const recipe=slot==='b'?['tiffin']:slot==='l'?['pappu','kura','@annam']:(i%2===0?['pulusu','@annam']:['kura','@chapati']);
      for(const want of recipe){
        let pick;
        if(want[0]==='@')pick=dishById(want.slice(1));
        else{
          let cands=allDishes().filter(d=>d.cat===want&&d.slots.includes(slot)&&!used.has(d.id));
          if(!cands.length)cands=allDishes().filter(d=>d.cat===want&&d.slots.includes(slot));
          let best=null,bs=-1e9;
          for(const d of cands){
            const m=matchInfo(d,vinv);
            const soonHits=d.ing.filter(([id])=>soon.has(id)&&(vinv[id]||0)>0).length;
            const sc=m.pct*3+soonHits*1.6-(dayMains.has(heroIngs(d)[0])?2.5:0)+Math.random()*0.9;
            if(sc>bs){bs=sc;best=d}
          }
          pick=best;
        }
        if(!pick)continue;
        p[slot].push(pick.id);used.add(pick.id);dayMains.add(heroIngs(pick)[0]);filled++;
        for(const [id,q] of Object.entries(needFor(pick)))vinv[id]=(vinv[id]||0)-q;
      }
    }
  }
  return filled;
}

/* ============ SHOPPING ============ */
function shopDates(){
  const t=new Date(),tk=todayKey(),mon=mondayOf(t),out=[];
  const from=ui.shop==='next'?addDays(mon,7):t;const to=ui.shop==='week'?addDays(mon,6):addDays(mon,13);
  for(let d=new Date(from.getFullYear(),from.getMonth(),from.getDate());d<=to;d=addDays(d,1)){const k=keyOf(d);if(k>=tk)out.push(k)}
  return out;
}
function mealNeeds(){
  const need={},why={};
  for(const k of shopDates())for(const [s] of SLOTS){if(state.cooked[k+'|'+s])continue;for(const did of peekDay(k)[s]){const d=dishById(did);if(!d)continue;for(const [id,q] of Object.entries(needFor(d))){need[id]=(need[id]||0)+q;(why[id]||(why[id]=new Set())).add(d.en)}}}
  const items=[];
  for(const [id,q] of Object.entries(need)){const g=ING[id];if(!g||g.staple)continue;const short=q-invQ(id);if(short>1e-6){const packs=Math.max(1,Math.ceil(short/g.pack-1e-9));items.push({id,need:q,have:invQ(id),short,packs,cost:packs*g.price,why:[...why[id]]})}}
  const order=Object.keys(ING);items.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  return items;
}
/* the shopping list is only what the user adds */
function myList(){
  const needs=Object.fromEntries(mealNeeds().map(x=>[x.id,x]));
  const order=Object.keys(ING);
  return Object.entries(state.list).filter(([id,n])=>ING[id]&&n>0).map(([id,packs])=>({id,packs,cost:packs*ING[id].price,meal:needs[id]||null})).sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
}
function suggestions(){const all=mealNeeds().filter(x=>!state.list[x.id]);return {show:all.filter(x=>!state.skip[x.id]),hidden:all.filter(x=>state.skip[x.id])}}
const packLabel=(g,packs)=>g.staple?packs+' '+(g.id==='oil'?(packs>1?'bottles':'bottle'):(packs>1?'packs':'pack')):fmtQty(packs*g.pack,g.unit);

  const open=myList().filter(x=>!state.bought[x.id]);const sugN=(()=>{const u=ui.shop;ui.shop='week';const n=suggestions().show.length;ui.shop=u;return n})();

  ${dayStrip()}
  <div class="today-grid"><div>${meals}</div>

  <div class="card"><h3>Shopping</h3><p class="small muted" style="margin:0 0 10px">${open.length?`${open.length} item${open.length>1?'s':''} on your list, about <b class="num">${money(open.reduce((a,b)=>a+b.cost,0))}</b>.`:'Your list is empty.'}${sugN?` ${sugN} suggested for this week's meals.`:''}</p><button class="btn sm" data-act="tab" data-id="shop">Open shopping list</button></div></aside></div>`;
}

function vWeek(){
  const ws=weekStart(),we=addDays(ws,6),tk=todayKey();
  let planned=0,cooked=0;const vegs=new Set();
  for(let i=0;i<7;i++){const k=keyOf(addDays(ws,i)),p=peekDay(k);for(const [s] of SLOTS){if(p[s].length)planned++;if(state.cooked[k+'|'+s])cooked++;p[s].forEach(did=>{const d=dishById(did);if(d)d.ing.forEach(([id])=>{if(ING[id]&&(ING[id].cat==='veg'||ING[id].cat==='leafy')&&!['onion','greenchilli','ginger','garlic','curryleaves','coriander','tomato'].includes(id))vegs.add(id)})})}}
  const saveUiShop=ui.shop;ui.shop=ui.week===0?'week':ui.week===1?'next':'week';const cost=ui.week<=1?mealNeeds().reduce((a,b)=>a+b.cost,0):null;ui.shop=saveUiShop;
  const range=`${ws.getDate()} ${MON[ws.getMonth()]} – ${we.getDate()} ${MON[we.getMonth()]}`;
  let grid=`<div class="week"><div class="corner"></div>${Array.from({length:7},(_,i)=>{const d=addDays(ws,i);return `<div class="wh ${keyOf(d)===tk?'today':''}">${DOW[i]}<b class="num">${d.getDate()}</b></div>`}).join('')}`;
  // desktop: row-major by slot; mobile: per-day groups. Build per-day groups and use CSS order for desktop.
  const cells=[];
  for(let i=0;i<7;i++){const d=addDays(ws,i),k=keyOf(d),p=peekDay(k);
    cells.push({i,k,d,html:SLOTS.map(([s,name])=>{const c=state.cooked[k+'|'+s];return `<div class="cell ${k<tk?'past':''} ${c?'cooked':''}" style="grid-row:${SLOTS.findIndex(x=>x[0]===s)+2};grid-column:${i+2}"><span class="lbl">${name}${c?' · cooked':''}</span>${p[s].map(did=>{const dd=dishById(did);if(!dd)return'';return `<div class="dchip">${icon(heroIngs(dd)[0],24)}<button class="n" data-act="dish" data-id="${dd.id}">${esc(dd.en)}</button><button class="x" data-act="rm" data-k="${k}" data-s="${s}" data-id="${dd.id}" aria-label="Remove ${esc(dd.en)}">×</button></div>`}).join('')}<button class="add" data-act="openPicker" data-k="${k}" data-s="${s}">+ Add</button></div>`}).join('')});
  }
  grid+=SLOTS.map(([s,name],r)=>`<div class="sl" style="grid-row:${r+2};grid-column:1">${name}</div>`).join('');
  grid+=cells.map(c=>`<div class="wday"><div class="wday-h"><b>${DOW[c.i]} ${c.d.getDate()}</b>${c.k===tk?'<span class="pill ok">Today</span>':''}</div>${c.html}</div>`).join('')+'</div>';
  return `<div class="section-h"><div><div class="eyebrow">Weekly menu</div><h2>Plan the week</h2><p>Tap + Add to choose dishes for any meal, or let Auto-plan fill the empty slots from your pantry, using up what's close to its best-before first.</p></div></div>
  <div class="week-bar"><button class="btn sm" data-act="week" data-d="-1" aria-label="Previous week">‹</button><span class="range num">${range}</span><button class="btn sm" data-act="week" data-d="1" aria-label="Next week">›</button>${ui.week!==0?'<button class="btn sm" data-act="week" data-d="0">This week</button>':''}<span style="flex:1"></span><button class="btn primary" data-act="auto">✦ Auto-plan empty slots</button><button class="btn warn" data-act="clearWeek" id="clearBtn">Clear week</button></div>
  <div class="stats"><div class="card stat"><span class="eyebrow">Meals planned</span><b class="num">${planned}/21</b></div><div class="card stat"><span class="eyebrow">Cooked</span><b class="num">${cooked}</b></div><div class="card stat"><span class="eyebrow">Different veg</span><b class="num">${vegs.size}</b></div><div class="card stat"><span class="eyebrow">Meals still need</span><b class="num">${cost==null?'—':money(cost)}</b></div></div>
  ${grid}`;
}

    <div class="chips" style="margin:10px 0 4px">${[['week','Rest of this week'],['next','Next week'],['both','Both weeks']].map(([id,l])=>`<button class="chip" data-act="shopRange" data-id="${id}" aria-pressed="${ui.shop===id}">${l}</button>`).join('')}</div>
    ${sg.show.length?(ui.sugAll?sg.show:sg.show.slice(0,5)).map(sRow).join('')+(sg.show.length>5?`<button class="listbtn" data-act="sugMore" style="margin-top:6px">${ui.sugAll?'Show fewer':'Show all '+sg.show.length+' suggestions'}</button>`:''):`<p class="small muted">${shopDates().length?'Nothing else needed. Your pantry and list cover the planned meals.':'No days left in this range.'}</p>`}
    ${sg.hidden.length?`<button class="listbtn" data-act="unskip" style="margin-top:6px">Show ${sg.hidden.length} you marked not needed</button>`:''}</section>`;
  return `<div class="section-h"><div><div class="eyebrow">Shopping list</div><h2>My list</h2><p>Only what you add goes on this list. Add groceries yourself, or pick from the suggestions for your planned meals.</p></div>
  <button class="btn primary" data-act="addGroceries">+ Add groceries</button></div>
  <div class="shop-grid"><div>${items.length?stores:`<div class="card empty"><h3>Your list is empty</h3><p>Tap <b>+ Add groceries</b> to choose what you need, or add from the suggestions below.</p></div>`}
  <div style="margin-top:14px">${sugHtml}</div></div>
  <aside class="card summary"><span class="eyebrow">Estimated spend</span><div class="total num">${money(total)}</div><p class="small muted" style="margin:6px 0 0">${open.length} item${open.length===1?'':'s'} left · ${got.length} in basket. Prices are rough Aberdeen averages.</p>
  <hr><button class="btn primary" data-act="putAway" ${got.length?'':'disabled'} style="width:100%;justify-content:center">Put ${got.length||''} bought item${got.length===1?'':'s'} in pantry</button>

function vPantry(){

  const inStock=Object.values(ING).filter(g=>!g.staple&&invQ(g.id)>0).length;
  const soonN=Object.keys(state.inv).filter(id=>{const f=freshness(id);return f&&f.cls!=='ok'}).length;
  const tile=g=>{
    if(g.staple){const st=state.staples[g.id]||'full';return `<div class="card tile">${`<div class="top-row">${icon(g.id,56)}<div><div class="nm">${esc(g.en)}</div><span class="te">${esc(g.te)}</span></div></div>`}<div class="meta">${g.note?`<span class="note">${esc(g.note)}</span>`:''}</div><div class="seg" role="group" aria-label="${esc(g.en)} level">${['full','low','out'].map(v=>`<button class="${v}" data-act="staple" data-id="${g.id}" data-v="${v}" aria-pressed="${st===v}">${v==='full'?'Stocked':v==='low'?'Low':'Out'}</button>`).join('')}</div><div class="foot" style="justify-content:flex-end"><button class="listbtn" data-act="extra" data-id="${g.id}" aria-pressed="${!!state.list[g.id]}">${state.list[g.id]?'✓ On list':'+ List'}</button></div></div>`}

  const body=cats.map(c=>{const list=Object.values(ING).filter(g=>g.cat===c&&(!q||g.en.toLowerCase().includes(q)||g.te.includes(ui.pantryQ)||g.note.toLowerCase().includes(q)));if(!list.length)return'';return `<div class="cat-h"><h3>${CATS[c]}</h3><span class="small muted">${c==='spice'?'Tap the level when a jar runs low':list.filter(g=>invQ(g.id)>0).length+' of '+list.length+' in stock'}</span></div><div class="grid-tiles">${list.map(tile).join('')}</div>`}).join('');

  <div id="pantryBody">${body||'<div class="empty">No groceries match that search.</div>'}</div>`;

  <h2 style="font-size:30px">${esc(d.en)}</h2><div class="te" style="font-size:20px">${esc(d.te||'')}</div>
  <div class="row small muted" style="margin-top:6px"><span class="pill plain">${DISH_CATS[d.cat]}</span><span>${d.mins} min</span><span>Quantities for ${state.people} ${state.people===1?'person':'people'}</span></div>
  <div class="detail-ings">${Object.entries(need).map(([iid,q])=>{const ok=invQ(iid)>=q-1e-6;return `<div class="di">${icon(iid,40)}<div class="grow"><b>${esc(ING[iid].en)}</b> <span class="te small">${esc(ING[iid].te)}</span><div class="num">${fmtQty(q,ING[iid].unit)}</div></div><span class="pill ${ok?'ok':'bad'}">${ok?'Have':'Buy'}</span></div>`}).join('')}</div>
  <p class="small muted" style="margin:0 0 4px">Plus the usual tadka box: oil, mustard, cumin, dry chillies, turmeric, chilli powder, salt.</p>
  ${d.steps?`<h3 style="font-size:19px;margin-top:14px">How to cook</h3><p style="max-width:65ch">${esc(d.steps)}</p>`:''}
  <h3 style="font-size:19px;margin-top:14px">Add to this week</h3>
  <div class="row" style="margin-top:8px"><select id="addDay" class="search" aria-label="Day">${Array.from({length:7},(_,i)=>{const x=addDays(ws,i);return `<option value="${keyOf(x)}" ${keyOf(x)===todayKey()?'selected':''}>${DOW[i]} ${x.getDate()} ${MON[x.getMonth()]}</option>`}).join('')}</select>
  <select id="addSlot" class="search" aria-label="Meal">${SLOTS.map(([s,n])=>`<option value="${s}" ${s===(d.slots.includes('l')?'l':d.slots[0])?'selected':''}>${n}</option>`).join('')}</select>
  <button class="btn primary" data-act="addToPlan" data-id="${d.id}">Add</button></div>
  ${isCustom?`<div class="row" style="margin-top:18px"><button class="btn warn sm" data-act="delDish" data-id="${d.id}" id="delDishBtn">Delete this dish</button></div>`:''}`,{dish:id});
}
function builderHtml(){
  const b=sheetCtx.b;
  return `<div class="sheet-h"><div><div class="eyebrow">Your recipe</div><h2>Build a dish</h2><p class="small muted" style="margin:4px 0 0">Tap the groceries that go into it. Quantities are for 2 people.</p></div><button class="close" data-act="closeSheet" aria-label="Close">×</button></div>
  <div class="row" style="align-items:end"><label class="field" style="flex:2;min-width:180px">Dish name<input id="bName" value="${esc(b.en)}" placeholder="e.g. Vankaya Tomato Kura"></label><label class="field" style="flex:1;min-width:140px">Telugu name (optional)<input id="bTe" value="${esc(b.te)}"></label>
  <label class="field" style="flex:1;min-width:140px">Type<select id="bCat">${Object.entries(DISH_CATS).map(([k,v])=>`<option value="${k}" ${b.cat===k?'selected':''}>${v}</option>`).join('')}</select></label></div>
  <div class="row" style="margin-top:12px">${b.ing.length?b.ing.map(([id,q],i)=>`<span class="ing-tag" style="padding-right:4px">${icon(id,24)}${esc(ING[id].en)}<span class="stepper" style="margin-left:4px"><button data-act="bQty" data-i="${i}" data-d="-1" aria-label="Less">−</button><span>${fmtQty(q,ING[id].unit)}</span><button data-act="bQty" data-i="${i}" data-d="1" aria-label="More">+</button></span></span>`).join(''):'<span class="small muted">No groceries picked yet.</span>'}</div>
  <div class="pickers" style="flex-wrap:wrap;overflow:visible;margin-top:12px">${Object.values(ING).filter(g=>!g.staple).map(g=>`<button class="pickv" data-act="bIng" data-id="${g.id}" aria-pressed="${b.ing.some(x=>x[0]===g.id)}">${icon(g.id,40)}<span>${esc(g.en)}</span></button>`).join('')}</div>
  <div class="row" style="justify-content:flex-end;margin-top:12px"><span class="small muted" id="bErr" style="color:var(--chilli)"></span><button class="btn primary" data-act="bSave">Save dish</button></div>`;
}
function syncBuilderFields(){const b=sheetCtx&&sheetCtx.b;if(!b)return;const n=$('#bName'),t=$('#bTe'),c=$('#bCat');if(n)b.en=n.value;if(t)b.te=t.value;if(c)b.cat=c.value}

/* ============ TOAST ============ */
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}

/* ============ EVENTS ============ */
let clearArmed=false,delArmed=false;
const A={
 tab:el=>{ui.tab=el.dataset.id;saveUi();closeSheet();render();window.scrollTo({top:0})},
 people:el=>{state.people=Math.min(12,Math.max(1,state.people+Number(el.dataset.d)));commit({keepSample:true})},
 sampleKeep:()=>{state.sample=false;commit()},
 sampleClear:()=>{state.inv={};state.plan={};state.cooked={};state.bought={};state.list={};state.skip={};Object.keys(state.staples).forEach(k=>state.staples[k]='full');state.sample=false;commit();toast('Pantry and plan cleared')},
 pickDay:el=>{ui.day=el.dataset.k;render()},
 goToday:()=>{ui.day=todayKey();render()},
 dayShift:el=>{ui.day=keyOf(addDays(parseKey(ui.day),Number(el.dataset.d)));render()},
 cook:el=>{
   const {k,s}=el.dataset,key=k+'|'+s;
   if(state.cooked[key]){for(const [id,q] of Object.entries(state.cooked[key].used||{}))addStock(id,q);delete state.cooked[key];commit();toast('Ingredients returned to pantry')}
   else{const used={};for(const [id,q] of Object.entries(slotNeeds(k,s))){const h=invQ(id),u=Math.min(h,q);if(u>0){setQ(id,h-u);used[id]=u}}state.cooked[key]={used,at:Date.now()};commit();toast('Enjoy! Pantry updated')}
 },
 openPicker:el=>{openSheet('',{k:el.dataset.k,s:el.dataset.s,q:'',all:false});$('#sheet').innerHTML=pickerHtml()},
 pickAll:()=>{sheetCtx.all=!sheetCtx.all;$('#sheet').innerHTML=pickerHtml()},
 togglePick:el=>{const {k,s}=sheetCtx,p=planDay(k)[s],id=el.dataset.id,i=p.indexOf(id);if(i>=0)p.splice(i,1);else p.push(id);commit();const y=$('#sheet').scrollTop;$('#sheet').innerHTML=pickerHtml();$('#sheet').scrollTop=y},
 closeSheet:()=>{closeSheet()},
 rm:el=>{const p=planDay(el.dataset.k)[el.dataset.s],i=p.indexOf(el.dataset.id);if(i>=0)p.splice(i,1);commit()},
 week:el=>{const d=Number(el.dataset.d);ui.week=d===0?0:ui.week+d;clearArmed=false;render()},
 auto:()=>{const n=autoPlan(weekStart());commit();toast(n?`Added ${n} dish${n>1?'es':''} to empty slots`:'No empty slots left to fill')},
 clearWeek:el=>{
   if(!clearArmed){clearArmed=true;el.textContent='Tap again to clear';setTimeout(()=>{clearArmed=false;const b=$('#clearBtn');if(b)b.textContent='Clear week'},3000);return}
   clearArmed=false;const ws=weekStart(),tk=todayKey();for(let i=0;i<7;i++){const k=keyOf(addDays(ws,i));if(k<tk)continue;if(state.plan[k])SLOTS.forEach(([s])=>{if(!state.cooked[k+'|'+s])state.plan[k][s]=[]})}commit();toast('Upcoming meals cleared')},
 shopRange:el=>{ui.shop=el.dataset.id;saveUi();render()},
 buy:el=>{const id=el.dataset.id;if(el.checked)state.bought[id]=true;else delete state.bought[id];commit({keepSample:true})},
 putAway:()=>{let n=0;for(const x of myList()){if(!state.bought[x.id])continue;const g=ING[x.id];if(g.staple)state.staples[g.id]='full';else addStock(x.id,x.packs*g.pack);delete state.list[x.id];n++}state.bought={};commit();toast(`${n} item${n===1?'':'s'} added to pantry`)},
 packs:el=>{const id=el.dataset.id,n=(state.list[id]||0)+Number(el.dataset.d);if(n<=0){delete state.list[id];delete state.bought[id]}else state.list[id]=n;commit()},
 unlist:el=>{const id=el.dataset.id;delete state.list[id];delete state.bought[id];commit();toast(`${ING[id].en} removed from list`)},
 sugAdd:el=>{state.list[el.dataset.id]=Number(el.dataset.p)||1;commit();toast(`${ING[el.dataset.id].en} added to list`)},
 sugAll:()=>{const sh=suggestions().show;sh.forEach(x=>state.list[x.id]=x.packs);commit();toast(`${sh.length} items added to list`)},
 sugMore:()=>{ui.sugAll=!ui.sugAll;render()},
 sugSkip:el=>{state.skip[el.dataset.id]=true;commit()},
 unskip:()=>{state.skip={};commit()},
 addGroceries:()=>{openSheet('',{add:true,q:''});$('#sheet').innerHTML=addSheetHtml()},
 listToggle:el=>{const id=el.dataset.id;if(state.list[id]){delete state.list[id];delete state.bought[id]}else{state.list[id]=1;delete state.skip[id]}commit({keepSample:true});const y=$('#sheet').scrollTop;$('#sheet').innerHTML=addSheetHtml();$('#sheet').scrollTop=y},
 copy:()=>{
   const items=myList().filter(x=>!state.bought[x.id]);const by={asian:[],super:[],both:[]};items.forEach(x=>by[ING[x.id].store].push(x));
   let txt=`Vantillu shopping list · ${new Date().getDate()} ${MON[new Date().getMonth()]}\n`;
   for(const s of ['asian','super','both'])if(by[s].length){txt+=`\n${STORES[s].toUpperCase()}\n`+by[s].map(x=>{const g=ING[x.id];return `☐ ${g.en} (${g.te}) — ${packLabel(g,x.packs)}`}).join('\n')+'\n'}
   txt+=`\nApprox. ${money(items.reduce((a,b)=>a+b.cost,0))}`;
   const box=$('#copyBox');box.value=txt;
   const fallback=()=>{box.hidden=false;box.focus();box.select();toast('Select all and copy the list below')};
   try{navigator.clipboard.writeText(txt).then(()=>toast('Shopping list copied'),fallback)}catch(e){fallback()}
 },
 qty:el=>{const g=ING[el.dataset.id],d=Number(el.dataset.d);setQ(g.id,invQ(g.id)+d*g.step);commit()},
 staple:el=>{const id=el.dataset.id,v=el.dataset.v;state.staples[id]=v;commit();if(v!=='full'&&!state.list[id])toast(`Marked ${v}. Tap + List if you want to buy it`)},
 extra:el=>{const id=el.dataset.id;if(state.list[id]){delete state.list[id];delete state.bought[id]}else{state.list[id]=1;delete state.skip[id]}commit();toast(state.list[id]?`${ING[id].en} added to shopping list`:`${ING[id].en} removed from list`)},
 pantryCat:el=>{ui.pantryCat=el.dataset.id;render()},
 dishCat:el=>{ui.dishCat=el.dataset.id;render()},
 pickIng:el=>{const id=el.dataset.id;ui.pickIngs=ui.pickIngs.includes(id)?ui.pickIngs.filter(x=>x!==id):ui.pickIngs.concat(id);render()},
 clearPick:()=>{ui.pickIngs=[];render()},
 dish:el=>{delArmed=false;dishSheet(el.dataset.id)},
 addToPlan:el=>{const k=$('#addDay').value,s=$('#addSlot').value,p=planDay(k)[s];if(!p.includes(el.dataset.id))p.push(el.dataset.id);commit();closeSheet();const d=parseKey(k);toast(`Added to ${DOW[(d.getDay()+6)%7]} ${SLOTS.find(x=>x[0]===s)[1].toLowerCase()}`)},
 delDish:el=>{if(!delArmed){delArmed=true;el.textContent='Tap again to delete';return}const id=el.dataset.id;state.custom=state.custom.filter(d=>d.id!==id);for(const p of Object.values(state.plan))SLOTS.forEach(([s])=>{p[s]=p[s].filter(x=>x!==id)});commit();closeSheet();toast('Dish deleted')},
 newDish:()=>{openSheet('',{b:{en:'',te:'',cat:'kura',ing:[]}});$('#sheet').innerHTML=builderHtml()},
 bIng:el=>{syncBuilderFields();const b=sheetCtx.b,id=el.dataset.id,i=b.ing.findIndex(x=>x[0]===id);if(i>=0)b.ing.splice(i,1);else{const g=ING[id];b.ing.push([id,g.unit==='g'?Math.max(g.step,Math.min(300,g.step*3)):g.step])}const y=$('#sheet').scrollTop;$('#sheet').innerHTML=builderHtml();$('#sheet').scrollTop=y},
 bQty:el=>{syncBuilderFields();const b=sheetCtx.b,i=Number(el.dataset.i),g=ING[b.ing[i][0]];b.ing[i][1]=Math.max(g.step,Math.round((b.ing[i][1]+Number(el.dataset.d)*g.step)*100)/100);const y=$('#sheet').scrollTop;$('#sheet').innerHTML=builderHtml();$('#sheet').scrollTop=y},
 bSave:()=>{syncBuilderFields();const b=sheetCtx.b;if(!b.en.trim()){$('#bErr').textContent='Give the dish a name.';return}if(!b.ing.length){$('#bErr').textContent='Pick at least one grocery.';return}
   const slots=b.cat==='tiffin'?'bd':b.cat==='pachadi'?'bld':'ld';
   state.custom.push({id:'my-'+Date.now().toString(36),en:b.en.trim(),te:b.te.trim(),cat:b.cat,slots,mins:30,ing:b.ing.map(x=>[x[0],x[1]]),steps:''});commit();closeSheet();toast('Dish saved')},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='sheetWrap')closeSheet();return}
  if(el.tagName==='INPUT'&&el.type==='checkbox')return; // handled on change
  const f=A[el.dataset.act];if(f){e.preventDefault();f(el)}
});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('input.tick[data-act="buy"]'))A.buy(el)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheetWrap').hidden)closeSheet()});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='pantryQ'){ui.pantryQ=t.value;const pos=t.selectionStart;render();const n=$('#pantryQ');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
  else if(t.id==='dishQ'){ui.dishQ=t.value;$('#dishBody').innerHTML=dishListHtml()}
  else if(t.id==='addQ'){sheetCtx.q=t.value;const tmp=document.createElement('div');tmp.innerHTML=addSheetHtml();$('#addBody').innerHTML=tmp.querySelector('#addBody').innerHTML}
  else if(t.id==='pickQ'){sheetCtx.q=t.value;const tmp=document.createElement('div');tmp.innerHTML=pickerHtml();$('#pickList').innerHTML=tmp.querySelector('#pickList').innerHTML}
});

/* first run: make a starter plan for this week so the tool opens in a working state */
if(firstRun){autoPlan(mondayOf(new Date()));autoPlan(addDays(mondayOf(new Date()),7));saveLocal()}
render();
</script>
