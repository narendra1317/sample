    <meta name="description" content="Keel: CPM scheduling, weekly timesheets, earned value, risk and EPC delivery tracking in one platform." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M6 10h20M6 16h14M6 22h8' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <style>
/* Keel — EPC project controls. Design tokens first; light & dark selected, not flipped. */
:root {
  color-scheme: light;
  --page: #f4f5f3;
  --surface: #fcfcfb;
  --surface-2: #f1f1ee;
  --surface-3: #e8e8e3;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #7a7872;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.1);
  --border-strong: rgba(11, 11, 11, 0.18);
  --nav: #0e1c2f;
  --nav-ink: #c9d3e0;
  --nav-active: #1d3350;
  --brand: #2a78d6;
  --brand-ink: #ffffff;
  --brand-soft: #e6f0fc;
  --focus: #2a78d6;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;
  --s7: #4a3aa7;
  --good: #0ca30c;
  --good-ink: #006300;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --critical-ink: #b42323;
  --bar: #2a78d6;
  --bar-critical: #d03b3b;
  --bar-done: #6f8fb4;
  --bar-baseline: #a9a79e;
  --bar-summary: #3a3935;
  --seq-100: #cde2fb;
  --seq-200: #9ec5f4;
  --seq-300: #6da7ec;
  --seq-400: #3987e5;
  --seq-500: #256abf;
  --seq-600: #184f95;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 4px 16px rgba(0, 0, 0, 0.06);
  --radius: 8px;
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232321;
    --surface-3: #2c2c2a;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #97958d;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.1);
    --border-strong: rgba(255, 255, 255, 0.18);
    --nav: #0a1320;
    --nav-active: #172a44;
    --brand: #3987e5;
    --brand-soft: #16273d;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --s5: #d55181;
    --s7: #9085e9;
    --good-ink: #0ca30c;
    --critical-ink: #e66767;
    --bar: #3987e5;
    --bar-done: #5d7797;
    --bar-baseline: #6b6a64;
    --bar-summary: #d8d6cc;
    --seq-100: #16273d;
    --seq-200: #184f95;
    --seq-300: #1c5cab;
    --seq-400: #256abf;
    --seq-500: #3987e5;
    --seq-600: #86b6ef;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
  }
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #232321;
  --surface-3: #2c2c2a;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #97958d;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.1);
  --border-strong: rgba(255, 255, 255, 0.18);
  --nav: #0a1320;
  --nav-active: #172a44;
  --brand: #3987e5;
  --brand-soft: #16273d;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s4: #c98500;
  --s5: #d55181;
  --s7: #9085e9;
  --good-ink: #0ca30c;
  --critical-ink: #e66767;
  --bar: #3987e5;
  --bar-done: #5d7797;
  --bar-baseline: #6b6a64;
  --bar-summary: #d8d6cc;
  --seq-100: #16273d;
  --seq-200: #184f95;
  --seq-300: #1c5cab;
  --seq-400: #256abf;
  --seq-500: #3987e5;
  --seq-600: #86b6ef;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 22px; }
h2 { font-size: 17px; }
h3 { font-size: 15px; }
h4 { font-size: 13px; color: var(--ink-2); text-transform: none; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---- layout ---- */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.nav { background: var(--nav); color: var(--nav-ink); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; color: #fff; font-weight: 700; font-size: 18px; letter-spacing: 0.02em; }
.brand svg { flex: none; }
.brand small { display: block; font-size: 10.5px; font-weight: 500; color: #8fa3bd; letter-spacing: 0.04em; text-transform: uppercase; }
.nav nav { padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }
.nav a { color: var(--nav-ink); padding: 8px 10px; border-radius: 6px; display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.nav a:hover { background: rgba(255, 255, 255, 0.06); text-decoration: none; }
.nav a.active { background: var(--nav-active); color: #fff; }
.nav a svg { width: 17px; height: 17px; opacity: 0.85; flex: none; }
.nav .section { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: #7086a3; padding: 14px 10px 4px; }
.nav .proj-link { font-size: 12.5px; padding: 5px 10px 5px 37px; }
.nav .proj-link .rag { margin-left: auto; }
.nav-foot { padding: 12px 14px; border-top: 1px solid rgba(255, 255, 255, 0.08); font-size: 12px; }
.nav-foot .who { color: #fff; font-weight: 600; }
.nav-foot button { background: none; border: 0; color: #8fa3bd; cursor: pointer; padding: 0; font: inherit; }
.nav-foot button:hover { color: #fff; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 20; }
.topbar .title { min-width: 0; }
.topbar .title h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.content { padding: 20px 24px 48px; min-width: 0; }
.menu-btn { display: none; }
.demo-banner { background: #fff4d6; color: #5a4300; font-size: 12.5px; padding: 6px 24px; border-bottom: 1px solid #f0dc9a; }
:root[data-theme='dark'] .demo-banner { background: #2c2508; color: #f3dc8e; border-color: #4d420f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .demo-banner { background: #2c2508; color: #f3dc8e; border-color: #4d420f; } }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .nav { position: fixed; z-index: 50; width: 260px; transform: translateX(-100%); transition: transform 0.2s; }
  .nav.open { transform: none; box-shadow: var(--shadow); }
  .menu-btn { display: inline-flex; }
  .topbar, .content { padding-left: 16px; padding-right: 16px; }
}

/* ---- components ---- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card > header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.card > header h3 { margin-right: auto; }
.card.flush { padding: 0; }
.card.flush > header { padding: 14px 16px 0; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3, .g-2-1 { grid-template-columns: 1fr; } }
@media (max-width: 700px) { .g2, .g4 { grid-template-columns: 1fr; } }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stack > * + * { margin-top: 16px; }
.right { margin-left: auto; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 6px 12px; font: 500 13px var(--font); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--critical-ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; }

input, select, textarea { font: 13px var(--font); color: var(--ink); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px 8px; min-width: 0; }
textarea { resize: vertical; min-height: 64px; }
input[type='checkbox'] { width: 16px; height: 16px; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); font-weight: 500; }
label.field > span.hint { font-weight: 400; color: var(--muted); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; scrollbar-width: thin; }
.tabs a { padding: 8px 12px; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; font-size: 13px; }
.tabs a:hover { color: var(--ink); text-decoration: none; }
.tabs a.active { color: var(--ink); border-bottom-color: var(--brand); }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; font: 500 12px var(--font); color: var(--ink-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button.on { background: var(--brand-soft); color: var(--ink); }

table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border-strong); white-space: nowrap; background: var(--surface); position: sticky; top: 0; z-index: 1; }
table.data th.sortable { cursor: pointer; user-select: none; }
table.data td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.data tr.clickable { cursor: pointer; }
table.data tr.clickable:hover td { background: var(--surface-2); }
table.data td.num, table.data th.num { text-align: right; }
.table-wrap { overflow: auto; max-width: 100%; }
.table-wrap.tall { max-height: 560px; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.pill .dot, .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.rag-green .dot, .dot.green { background: var(--good); }
.rag-amber .dot, .dot.amber { background: var(--warning); }
.rag-red .dot, .dot.red { background: var(--critical); }
.dot.grey { background: var(--axis); }
.status-approved { color: var(--good-ink); }
.status-rejected { color: var(--critical-ink); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.kpi .label { font-size: 12px; color: var(--ink-2); }
.kpi .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
.kpi .delta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.kpi .delta.bad { color: var(--critical-ink); }
.kpi .delta.good { color: var(--good-ink); }
.hero { font-size: 44px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; }

.insight { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.insight:last-child { border-bottom: 0; }
.insight .ico { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; }
.insight.critical .ico { background: var(--critical); }
.insight.warning .ico { background: var(--warning); color: #3d2b00; }
.insight.info .ico { background: var(--s1); }
.insight.good .ico { background: var(--good); }
.insight .t { font-weight: 600; }
.insight .d { color: var(--ink-2); font-size: 12.5px; }

.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.callout { padding: 10px 12px; border-radius: 6px; background: var(--brand-soft); font-size: 13px; }
.callout.warn { background: #fff4d6; color: #5a4300; }
:root[data-theme='dark'] .callout.warn { background: #2c2508; color: #f3dc8e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .callout.warn { background: #2c2508; color: #f3dc8e; } }

/* ---- modal / drawer / toast ---- */
.overlay { position: fixed; inset: 0; background: rgba(8, 14, 24, 0.45); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); width: 100%; max-width: 640px; }
.modal.wide { max-width: 920px; }
.modal header { padding: 16px 20px 0; display: flex; align-items: center; }
.modal header h2 { margin-right: auto; }
.modal .body { padding: 16px 20px; }
.modal footer { padding: 12px 20px 16px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--border); }
.drawer-overlay { position: fixed; inset: 0; background: rgba(8, 14, 24, 0.3); z-index: 90; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--surface); box-shadow: var(--shadow); z-index: 91; display: flex; flex-direction: column; }
.drawer header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 8px; }
.drawer header .h { margin-right: auto; min-width: 0; }
.drawer .body { padding: 16px 20px; overflow-y: auto; flex: 1; }
.drawer footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
.toasts { position: fixed; bottom: 16px; right: 16px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); font-size: 13px; max-width: 380px; }
.toast.error { background: var(--critical); color: #fff; }
.tooltip { position: fixed; pointer-events: none; z-index: 300; background: var(--surface); color: var(--ink); border: 1px solid var(--border-strong); border-radius: 6px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; max-width: 320px; }
.tooltip .v { font-weight: 600; font-size: 13px; }
.tooltip .k { color: var(--ink-2); }
.tooltip .line { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; border-radius: 1px; }

/* ---- charts ---- */
.chart { width: 100%; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .grid-line { stroke: var(--grid); stroke-width: 1; }
.chart .axis-line { stroke: var(--axis); stroke-width: 1; }
.chart .label-strong { fill: var(--ink); font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend .key { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend .ln { width: 16px; height: 2px; border-radius: 1px; display: inline-block; }

/* ---- gantt ---- */
.gantt-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.gantt { display: grid; grid-template-columns: var(--gantt-left, 620px) minmax(0, 1fr); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.gantt .g-left { border-right: 1px solid var(--border-strong); overflow-x: auto; overflow-y: hidden; min-width: 0; }
.gantt .g-right { overflow: hidden; position: relative; min-width: 0; }
.gantt .scroller { max-height: calc(100vh - 250px); min-height: 320px; overflow-y: auto; overflow-x: hidden; display: contents; }
.gantt-v { max-height: calc(100vh - 250px); min-height: 300px; overflow-y: auto; }
.g-row { height: 28px; display: grid; align-items: center; font-size: 12.5px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.g-head { height: 44px; position: sticky; top: 0; z-index: 3; background: var(--surface-2); font-weight: 600; color: var(--ink-2); font-size: 11.5px; border-bottom: 1px solid var(--border-strong); }
.g-row > div { padding: 0 6px; overflow: hidden; text-overflow: ellipsis; }
.g-row.wbs { background: var(--surface-2); font-weight: 600; cursor: pointer; }
.g-row.act { cursor: pointer; }
.g-row.act:hover, .g-row.sel { background: var(--brand-soft); }
.g-row .crit-txt { color: var(--critical-ink); font-weight: 600; }
.g-row .neg { color: var(--critical-ink); font-weight: 600; }
.g-cols { grid-template-columns: 86px minmax(180px, 1fr) 46px 78px 78px 44px 46px; }
.gantt svg { display: block; }
.gantt svg text { font-size: 10.5px; fill: var(--muted); font-family: var(--font); }
.gantt .gbar { cursor: pointer; }
.g-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
@media (max-width: 900px) { .gantt { grid-template-columns: 1fr; } .gantt .g-right { display: none; } }

/* ---- heatmap ---- */
.heat { border-collapse: separate; border-spacing: 2px; font-size: 12px; }
.heat th { font-weight: 500; color: var(--ink-2); padding: 2px 4px; white-space: nowrap; }
.heat td.cell { width: 52px; min-width: 52px; height: 30px; text-align: center; border-radius: 4px; font-variant-numeric: tabular-nums; cursor: default; }
.heat td.cell.over { box-shadow: inset 0 0 0 2px var(--critical); font-weight: 700; }
.heat td.name { padding-right: 10px; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.heat td.cell:hover { outline: 2px solid var(--ink); }

/* ---- timesheet ---- */
.ts-grid { width: 100%; border-collapse: collapse; font-size: 13px; }
.ts-grid th { font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 6px; text-align: center; border-bottom: 1px solid var(--border-strong); }
.ts-grid th.l { text-align: left; }
.ts-grid td { padding: 4px; border-bottom: 1px solid var(--border); text-align: center; }
.ts-grid td.l { text-align: left; }
.ts-grid input.h { width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
.ts-grid input.h.weekend { background: var(--surface-2); }
.ts-grid select { max-width: 280px; }
.ts-grid tfoot td { font-weight: 600; border-top: 1px solid var(--border-strong); }
.ts-grid .over { color: var(--critical-ink); }

/* ---- login ---- */
.login-wrap { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.login-hero { background: linear-gradient(160deg, #0e1c2f 0%, #16325a 100%); color: #dbe5f1; padding: 56px; display: flex; flex-direction: column; justify-content: center; }
.login-hero h1 { color: #fff; font-size: 34px; line-height: 1.15; margin: 18px 0 12px; }
.login-hero ul { padding-left: 18px; color: #b8c7da; }
.login-hero li { margin: 6px 0; }
.login-form { display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
.login-form .card { width: 100%; max-width: 380px; padding: 28px; }
.demo-accounts button { width: 100%; justify-content: space-between; margin-top: 6px; }
@media (max-width: 900px) { .login-wrap { grid-template-columns: 1fr; } .login-hero { padding: 32px 20px; } .login-hero h1 { font-size: 26px; } }

.progress { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; min-width: 60px; }
.progress > span { display: block; height: 100%; background: var(--s1); border-radius: 3px; }
.stage-dots { display: inline-flex; gap: 3px; }
.stage-dots i { width: 10px; height: 10px; border-radius: 2px; background: var(--surface-3); display: inline-block; }
.stage-dots i.done { background: var(--s3); }
.stage-dots i.late { background: var(--critical); }
.stage-dots i.na { opacity: 0.3; background: transparent; box-shadow: inset 0 0 0 1px var(--axis); }
.check-row { display: grid; grid-template-columns: 30px 1fr 110px 90px 80px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.check-row .badge { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: var(--surface-3); }
.check-row.pass .badge { background: var(--good); color: #fff; }
.check-row.fail .badge { background: var(--critical); color: #fff; }
@media (max-width: 700px) { .check-row { grid-template-columns: 30px 1fr 80px; } .check-row .hide-sm { display: none; } }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
